name: Windows инсталатор

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Сваляне на библиотеките (jsQR, mammoth)
        shell: bash
        run: bash scripts/fetch-vendor.sh

      - name: npm install
        run: npm install

      - name: Сглобяване (само NSIS инсталатор)
        run: npx tauri build

      - name: Качване на инсталатора
        uses: actions/upload-artifact@v4
        with:
          name: TPrompt-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Публикуване във Releases (при таг v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
