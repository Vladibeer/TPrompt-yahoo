name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Сваляне на библиотеките (jsQR, mammoth)
        run: bash scripts/fetch-vendor.sh

      - name: npm install
        run: npm install

      - name: Създаване на Android проекта
        run: npx cap add android

      - name: Разрешения, http връзка и икони
        run: |
          pip install pillow
          python3 scripts/android-patch.py

      - name: Синхронизиране на www
        run: npx cap sync android

      - name: Сглобяване на APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Преименуване
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TPrompt.apk

      - name: Качване на APK
        uses: actions/upload-artifact@v4
        with:
          name: TPrompt-Android-apk
          path: TPrompt.apk
          if-no-files-found: error

      - name: Публикуване във Releases (при таг v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TPrompt.apk
