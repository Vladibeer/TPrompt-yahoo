<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f22">
<title>TPrompt дистанционно</title>
<style>
:root{--bg:#0c0f22;--panel:#141936;--panel2:#1b2148;--line:#2b3270;--ink:#e9ecff;--mute:#949bcb;--acc:#7c6cff;--teal:#2fe0c0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 14px/1.4 system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
#pv{position:relative;overflow:hidden;background:#000;border-radius:4px}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
#scroller{position:relative;will-change:transform}
#text{margin:0 auto;word-wrap:break-word}
#text p,#text h1,#text h2,#text h3,#text h4,#text h5,#text h6,#text ul,#text ol{margin:0 0 .6em}
#text h1{font-size:1.6em}#text h2{font-size:1.4em}#text h3{font-size:1.2em}
#text ul,#text ol{padding-left:1.3em}
#band{position:absolute;left:0;right:0;display:none;pointer-events:none}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#949bcb;padding:20px}
.bar{padding:8px 10px 12px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.prog{position:relative;height:26px;cursor:pointer;touch-action:none}
.prog::before{content:"";position:absolute;left:0;right:0;top:10px;height:6px;border-radius:3px;background:var(--line)}
.prog i{position:absolute;left:0;right:0;top:10px;height:6px;border-radius:3px;background:linear-gradient(90deg,#2fe0c0,#7c6cff);transform-origin:left;transform:scaleX(0)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;height:52px;min-width:52px;padding:0 12px;cursor:pointer;touch-action:manipulation}
button:active{background:#252c5c}
button.play{flex:1 1 40%;background:var(--teal);border-color:var(--teal);color:#06231d;font-size:17px;font-weight:800}
.grp{flex:1 1 calc(50% - 4px);display:flex;align-items:center;justify-content:space-between;gap:4px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:3px}
.grp button{border:0;background:none;height:46px;min-width:46px;font-size:20px}
.grp span{flex:1;text-align:center;font-size:16px;font-weight:800}
.grp small{color:var(--mute);font-weight:600;margin-left:6px}
#bms{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
#bms button{height:40px;flex:none;font-size:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bms button.cur{border-color:var(--teal);color:var(--teal)}
#st{color:var(--mute);font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="wrap"><div id="pv"><div id="stage"><div id="scroller"><div id="text"></div></div><div id="band"></div></div><div id="msg">Свързване…</div></div></div>
<div class="bar">
  <div class="prog" id="prog"><i id="fill"></i></div>
  <div class="row">
    <button class="play" id="play">Старт</button>
    <button id="home" title="В началото">⏮</button>
    <button id="prev" title="Предишна отметка">‹</button>
    <button id="next" title="Следваща отметка">›</button>
  </div>
  <div class="row">
    <div class="grp"><button id="sd">−</button><span>Скорост <small id="sv">15</small></span><button id="su">+</button></div>
    <div class="grp"><button id="fd">−</button><span>Размер <small id="fv">64</small></span><button id="fu">+</button></div>
  </div>
  <div id="bms"></div>
  <div id="st"></div>
</div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const T=new URLSearchParams(location.search).get('t')||'';
const api=(p)=>p+'?t='+encodeURIComponent(T);
const cmd=(c,a)=>fetch(api('/api/cmd'),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({cmd:c,arg:a})}).catch(()=>{});
let st={},rev=-1,css={},W=1280,H=720,sc=1,max=0;
let base={frac:0,fr:0,at:performance.now()};
let lastBm='',ok=false;
const pv=$('#pv'),stage=$('#stage'),scroller=$('#scroller'),text=$('#text'),band=$('#band'),msg=$('#msg');
function layout(){
  const wrap=$('#wrap'),aw=wrap.clientWidth-20,ah=wrap.clientHeight-20;
  if(aw<=0||ah<=0)return;
  sc=Math.min(aw/W,ah/H);
  pv.style.width=W*sc+'px';pv.style.height=H*sc+'px';
  stage.style.width=W+'px';stage.style.height=H+'px';stage.style.transform='scale('+sc+')';
  const r=document.documentElement.style;
  text.style.fontSize=(css.fs||64)+'px';text.style.lineHeight=css.lh||1.35;text.style.width=(css.width||82)+'%';
  text.style.color=css.color||'#fff';text.style.fontFamily=css.font||'sans-serif';
  stage.style.background=css.bg||'#000';pv.style.background=css.bg||'#000';
  r.setProperty('--pfs',(css.fs||64)+'px');
  const my=css.markerY||42;
  scroller.style.paddingTop=H*my/100+'px';scroller.style.paddingBottom=H*(1-my/100)+'px';
  max=Math.max(0,scroller.offsetHeight-H);
  band.style.display=css.marker?'block':'none';
  band.style.top=(H*my/100-(css.markerH||140)/2)+'px';band.style.height=(css.markerH||140)+'px';
  band.style.background=(css.markerColor||'#ffb547')+'22';
}
async function loadContent(){
  try{
    const r=await fetch(api('/api/content'),{cache:'no-store'});const c=await r.json();
    rev=c.rev;css=c.css||{};text.innerHTML=c.html||'';layout();
  }catch(e){}
}
function apply(s){
  st=s;
  if(s.W&&s.H&&(s.W!==W||s.H!==H)){W=s.W;H=s.H;layout()}
  base={frac:s.frac||0,fr:s.fr||0,at:performance.now()};
  if(s.rev!==undefined&&s.rev!==rev)loadContent();
  $('#play').textContent=s.mode==='edit'?'Старт':(s.playing?'Пауза':'Старт');
  $('#sv').textContent=s.speed??'';$('#fv').textContent=s.fs??'';
  const sig=JSON.stringify([s.bm,s.bmIdx]);
  if(sig!==lastBm){
    lastBm=sig;const box=$('#bms');box.innerHTML='';
    (s.bm||[]).forEach((t,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+t;if(i===s.bmIdx)b.className='cur';b.onclick=()=>cmd('bm',i);box.appendChild(b)});
  }
  const modes={edit:'Редакция на компютъра',read:'Чете на компютъра',win:'Чете във втори прозорец'};
  $('#st').textContent=(s.title?s.title+' · ':'')+(modes[s.mode]||'')+(s.time?' · '+s.time:'');
  msg.style.display=(s.mode==='edit')?'flex':'none';
  if(s.mode==='edit')msg.textContent='Натиснете „Старт“, за да започне четенето.';
}
async function poll(){
  try{
    const r=await fetch(api('/api/state'),{cache:'no-store'});
    if(r.status===403){msg.style.display='flex';msg.textContent='Кодът вече не е валиден. Сканирайте нов QR код.';return}
    apply(await r.json());ok=true;
  }catch(e){ok=false;msg.style.display='flex';msg.textContent='Няма връзка с компютъра…'}
}
setInterval(poll,250);poll();
function frame(now){
  const f=Math.min(1,Math.max(0,base.frac+base.fr*Math.max(0,now-base.at)/1000));
  scroller.style.transform='translate3d(0,'+(-f*max)+'px,0)';
  $('#fill').style.transform='scaleX('+f+')';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
$('#play').onclick=()=>cmd(st.mode==='edit'?'start':'play');
$('#home').onclick=()=>cmd('home');
$('#prev').onclick=()=>cmd('prev');
$('#next').onclick=()=>cmd('next');
$('#sd').onclick=()=>cmd('speed',-5);$('#su').onclick=()=>cmd('speed',5);
$('#fd').onclick=()=>cmd('fs',-1);$('#fu').onclick=()=>cmd('fs',1);
$('#prog').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();cmd('seek',Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)))});
window.addEventListener('resize',layout);
})();
</script>
</body>
</html>
